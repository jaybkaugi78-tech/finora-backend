
[project]
name = "finora-backend"
version = "1.0.0"
description = "Finora V2 Flask API"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.0,<4",
    "Flask-SQLAlchemy>=3.1,<4",
    "Flask-Migrate>=4,<5",
    "Flask-JWT-Extended>=4.6,<5",
    "Flask-Cors>=4,<6",
    "Flask-Limiter[redis]>=3.8,<5",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1,<2",
    "gunicorn>=22,<24",
]

[tool.vercel]
entrypoint = "run:app"
